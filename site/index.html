<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>can't wait to see you again</title>
    <meta name="description" content="you're invited.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0e0c12">
    <meta name="color-scheme" content="dark">

    <!-- Link preview (iMessage, WhatsApp, Slack...). og:image must be a full URL:
         if your address isn't cantwaittoseeyouagain.pages.dev, change it here. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="can't wait to see you again">
    <meta property="og:description" content="solve the puzzle.">
    <meta property="og:image" content="https://cantwaittoseeyouagain.pages.dev/og.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preload" href="clips/media.json" as="fetch" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Shared SVG resources (filters and gradients). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <filter id="pz-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
            <linearGradient id="pz-sheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
                <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
                <stop offset="1" stop-color="#000" stop-opacity=".14"/>
            </linearGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
                <stop offset=".45" stop-color="#fff" stop-opacity=".22"/>
                <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
            </linearGradient>
        </defs>
    </svg>

    <main id="stage">
        <!-- 1. the puzzle -->
        <section id="puzzle" aria-label="Puzzle. Drag the pieces into place.">
            <div id="assembled"></div>
            <div id="pieces"></div>
            <svg id="seams" aria-hidden="true"></svg>
        </section>
        <div id="progress" aria-hidden="true"><i></i></div>
        <p id="hint" aria-hidden="true">piece it together</p>

        <!-- 2. the reveal: clips + the words. Edit the headline and the three lines under it to change them. -->
        <section id="slideshow" aria-hidden="true" data-tone="light">
            <div id="videos"></div>
            <div class="scrim"></div>
            <div id="title" class="title">
                <div class="stack">
                    <h1 id="headline" class="headline">dinner?</h1>
                    <p class="line address" id="address">2512 Farlow Gap Ln, Raleigh NC, 27603</p>
                    <p class="line date" id="date">oct 17th</p>
                    <p class="line time" id="time">6pm</p>
                </div>
            </div>
        </section>

        <!-- the play button: a rounded triangle of frosted glass. It is built from plain parts
             (see .play-glass in style.css) so every browser draws the same triangle. -->
        <div id="play-wrap">
            <button id="play" type="button" aria-label="Play">
                <svg class="play-shadow" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 20.34A6 6 0 0 1 26.98 15.13L78.88 44.79A6 6 0 0 1 78.88 55.21L26.98 84.87A6 6 0 0 1 18 79.66Z"/></svg>
                <span class="play-glass"><i class="play-blur"></i><i class="play-tint"></i></span>
                <svg class="play-rim" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 20.34A6 6 0 0 1 26.98 15.13L78.88 44.79A6 6 0 0 1 78.88 55.21L26.98 84.87A6 6 0 0 1 18 79.66Z"/></svg>
            </button>
        </div>

        <button id="reset" class="chip" type="button" aria-label="Start the puzzle over">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
            <span class="label">start over?</span>
        </button>

        <button id="toggle" class="chip" type="button" aria-label="Pause">
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4"/></svg>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8.25A1.7 1.7 0 0 1 10.59 6.8L16.66 10.55A1.7 1.7 0 0 1 16.66 13.45L10.59 17.2A1.7 1.7 0 0 1 8 15.75Z"/></svg>
        </button>

        <div id="loader" aria-hidden="true"></div>
        <p id="notice" role="status" hidden></p>
    </main>

    <noscript><p class="nojs">this page needs JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
